
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# ⚠️ Fix TLS pour Gradle
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.com.sun.net.ssl.checkRevocation=false

# ⚠️ Fix Kotlin daemon
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.daemon=true
android.builtInKotlin=false
android.newDsl=false

# AAPT2 custom path (fix pour macOS)
android.aapt2FromMavenOverride=/Users/kouassi/Downloads/aapt2-custom/aapt2
