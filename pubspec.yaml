name: flash_deals_app
description: Application e-commerce de vente flash pour grandes surfaces à Abidjan
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  go_router: ^13.0.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  intl: any
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  flutter_dotenv: ^5.1.0
  pdf: ^3.11.3
  printing: ^5.14.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  crypto: ^3.0.7
  image_picker: ^1.1.2
  http: ^1.6.0
  onesignal_flutter: ^5.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  package_info_plus: ^8.1.0
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/banners/
    - assets/images/placeholders/
    - assets/images/icons/
    - assets/images/categories/
    - assets/images/stores/
    - assets/animations/lottie/
    - web/paiement_init.html

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/logo.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/images/logo/logo.png"
    background_color: "#0D0D0D"
    theme_color: "#FF6B00"
  windows:
    generate: true
    image_path: "assets/images/logo/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo/logo.png"

# ⚠️ Fix incompatibilité geolocator_android
dependency_overrides:
  package_info_plus: 8.1.0
  geolocator_android: 4.6.1
